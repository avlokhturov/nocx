<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- script-src deliberately carries no 'unsafe-inline'. Neither the Vite
         dev server nor the production build emits an inline script (both load
         /@vite/client and the bundle by src), so inline script stays blocked
         and an injected onerror= handler cannot execute even if the escaping
         in connections.ts regresses. style-src keeps 'unsafe-inline' because
         the UI assigns element.style.* directly and xterm injects stylesheets
         at runtime. connect-src is pinned to the loopback PTY socket. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; font-src 'self' data:; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
    />
    <title>nocx</title>
  </head>
  <body>
    <div id="app">
      <div id="body">
        <div id="activitybar"></div>
        <div id="sidebar"></div>
        <div id="panes"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
