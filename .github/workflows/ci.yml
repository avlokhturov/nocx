# CI — quality gates for nocx.
#
# Runner decision: back-end job runs on macos-latest because:
#   - darwin is the target platform for this macOS-first MVP (see
#     docs/architecture.md § "Operational / Environmental Envelope"), so CI
#     should build and test what ships to users;
#   - internal/pty exercises creack/pty, and PTY semantics differ between macOS
#     and Linux — those tests are only meaningful on the target OS;
#   - the repo is public, so macos-latest runner minutes are free.
# (Note: wails/v2 also requires GTK3/WebKit2GTK on Linux; the decision stands
# on the target-OS argument alone, without measuring ubuntu.)
# Every job here has a local runner that IS the job, and `make ci-full` runs
# them all:
#
#   backend        make ci                   (this host, macOS — see below)
#   backend-linux  scripts/ci-linux.sh       ubuntu-24.04, both keyring variants
#   frontend       scripts/ci-frontend.sh    node 24, frontend/ AND the repo root
#   e2e            e2e/run-in-container.sh   the same image and the same command
#
# `make ci` alone is the host-side half only. The Makefile used to be described
# here as mirroring "this same set of checks so green is identical locally and
# in CI"; it covered one of the four jobs, and a release attempt and its
# follow-up PR both came back red from a job the local gate had just reported
# green (2026-08-10, nocx-cn86). The claim is now a list, and each line of it is
# a command somebody can run.
#
# `backend` is the one job with no container, and deliberately: macos-latest is
# the target OS. That makes it the one place where local and CI can still
# disagree — and they do (nocx-58gq, nocx-65v6). See the Makefile's `ci` target.
#
# Trigger decision: CI runs on pull requests to main, on release branches
# (release/**) and manual workflow_dispatch, and is *called* by release.yml via
# workflow_call so a tag release cannot exist without a green run on that exact
# commit. The `pull_request: [main]` trigger is the mechanical gate on main
# (nocx-q36): the local pre-commit hook and `make ci` give the same checks as
# fast feedback, but a hook is bypassable with --no-verify and `make hooks` is a
# per-clone step a fresh checkout may skip, so CI is what actually enforces "no
# merge without green". The standalone `push: tags: ['v*']` trigger stays gone:
# with release.yml calling this workflow, keeping it would run the whole suite
# twice for every release for no added protection (see distribution design §5).

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['release/**']
  workflow_dispatch:
  workflow_call:

# Least privilege: the quality gates only read the repo. When release.yml calls
# this workflow the effective token is the intersection with what the caller
# grants, so the publish job's write scope never reaches these jobs.
permissions:
  contents: read

jobs:
  backend:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check formatting
        run: |
          UNFMT=$(gofumpt -l .)
          if [ -n "$UNFMT" ]; then
            echo "gofumpt: the following files need formatting:"
            echo "$UNFMT"
            exit 1
          fi
          echo "gofumpt: all files formatted"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Lint
        run: golangci-lint run ./...

      - name: Build
        run: go build ./...

      # The shellintegration launcher tests fail, not skip, when the shell
      # they must prove is absent (nocx-gd84). macOS ships zsh but not dash;
      # TestBashLauncher_RunsUnderDash and TestPosixLauncher_EmitsMarkersFromPS1
      # both need dash, so a job that ran the suite as-is would fail them.
      # ubuntu-latest ships both shells; this step is macOS-only.
      - name: Install dash (shell integration tests)
        run: brew install dash

      - name: Test
        run: go test -race -count=1 ./...

      # The shipped profile directory lives behind `-tags release`
      # (internal/storage/appdir.go), so the ordinary run never compiles it. One
      # package, one assertion — but without it a typo there ships an app that
      # cannot find any existing installation's documents.
      - name: Test (release build tag)
        run: go test -race -count=1 -tags release ./internal/storage/...

  # backend-linux — Go tests on Linux, with and without a Secret Service.
  #
  # Runner decision: ubuntu-latest is the standard CI Linux image. The macOS
  # backend job tests the target OS; this job tests Linux behaviour, which
  # matters because go-keyring's back end is platform-specific and the
  # release pipeline ships a linux/amd64 AppImage.
  #
  # Matrix decision: two variants (with-keyring: true / false) in one job
  # rather than two separate jobs. Rationale: common steps (checkout,
  # setup-go, build) appear once; GitHub auto-labels each variant; one job
  # ID for required checks.
  #
  # fail-fast is off for the reason these two variants exist at all: they are a
  # comparison. The question a red run has to answer is WHICH of "with a Secret
  # Service" and "without one" broke, and the default would cancel the survivor
  # the moment the first one failed — leaving exactly one of the two readings
  # the job was built to take.
  backend-linux:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        with-keyring: [true, false]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # The same provisioning the macOS job needs, for the same reason: the
      # launcher tests fail rather than skip when the shell they exist to prove
      # is missing (nocx-gd84), and a skip there would hide the riskiest paths
      # in the package. macOS was given dash because it ships zsh; ubuntu is the
      # mirror image — it ships dash and no zsh — and never got the treatment,
      # so five zsh launcher tests were failing on main (nocx-bbkh).
      - name: Install zsh (shell integration tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          # ubuntu's zsh ships completion directories that are group-writable,
          # so compinit refuses them and asks "Ignore insecure directories and
          # continue [y] or abort compinit [n]?" — on a tty, interactively. Our
          # launcher tests drive a real PTY and nothing answers, so every zsh
          # test hangs until its own timeout and reports whatever it was waiting
          # for instead of the question it was actually being asked.
          #
          # Fixed rather than suppressed: ZSH_DISABLE_COMPFIX=true would silence
          # the prompt and leave CI running a zsh configured unlike any user's.
          zsh -c 'autoload -Uz compaudit; compaudit 2>/dev/null || true' \
            | while read -r d; do [ -n "$d" ] && sudo chmod -R go-w "$d"; done
          echo "=== compaudit after fix (empty is correct) ==="
          zsh -c 'autoload -Uz compaudit; compaudit 2>/dev/null || true'

      # The third shell this job must carry, and the only one that is not a
      # shell anybody here runs: macOS's /bin/bash is GNU bash 3.2.57, and the
      # integration script has to PARSE there. A bash-4 construct is rejected
      # while the file is being read, so no runtime version guard inside it
      # can help — which is how every macOS shell came up with no integration
      # while all of Linux stayed green (nocx-cn86). The macOS job proves the
      # behaviour against a real 3.2; this makes the parse check run on the
      # side that a Linux developer and this job can both see.
      - name: Install bash 3.2 (macOS's /bin/bash)
        run: sudo scripts/install-bash32.sh

      - name: Install Secret Service & dbus-x11
        if: matrix.with-keyring
        run: sudo apt-get install -y -qq gnome-keyring dbus-x11

      - name: Build
        run: go build ./...

      - name: Test (with Secret Service)
        if: matrix.with-keyring
        run: |
          dbus-run-session -- bash <<'TESTEOF'
          set -euo pipefail
          echo "=== Starting gnome-keyring-daemon ==="
          eval "$(echo -n "nocx-ci" | gnome-keyring-daemon --daemonize --login)"
          echo "=== Unlocking login keyring ==="
          echo -n "nocx-ci" | gnome-keyring-daemon --unlock
          echo "=== Running tests ==="
          go test -race -count=1 ./...
          TESTEOF

      - name: Test (no Secret Service)
        if: '!matrix.with-keyring'
        run: go test -race -count=1 ./...

  frontend:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The e2e suite is TypeScript too, and nothing was checking it. Two specs
      # were dead on their first line for as long as anyone can measure —
      # history-persistence imported a type harness.ts had stopped exporting,
      # tabby-import read a field off a shape that had none — and both are
      # compile errors that ran anyway, because the runner strips types rather
      # than checking them. They surfaced as "argument must be of type string.
      # Received undefined" from inside node:path, and only once CI began
      # building the devharness those specs need (nocx-azxe.2).
      - name: Typecheck the e2e suite
        working-directory: .
        run: |
          npm ci
          npm run typecheck

      # The root lint and format, which until now ran ONLY in the pre-commit
      # hook — and had not actually run there for some time. `eslint .` and
      # `prettier --check .` walk the filesystem, and the e2e container leaves
      # its disposable home root-owned, so both died on EACCES while expanding
      # the directory, before examining a file. A crashing gate reports nothing,
      # so nothing was reported: 19 lint errors and 15 unformatted files had
      # accumulated behind it. The steps above check `frontend/`, which is a
      # different eslint config and a different tree — it never covered this one
      # (nocx-z9s9.8).
      - name: Lint the repo root (e2e, hooks, config)
        working-directory: .
        run: npm run lint
      - name: Check formatting at the repo root
        working-directory: .
        run: npm run format:check

      # The coverage receipt: every *.spec.ts on disk is collected by some
      # project. A hand-written exclusion list cannot report a file that is on
      # neither list, which is how seven specs once ran nowhere while the
      # shards stayed green (nocx-azxe.2).
      - name: Every spec file is collected
        working-directory: .
        run: node e2e/check-coverage.mjs

  # e2e — the suite, in the same container a developer runs it in.
  #
  # ONE command: `e2e/run-in-container.sh`. Inside it, `npx playwright test`; the
  # stand it drives — cmd/devharness on a real PTY plus vite serving the renderer
  # — is Playwright's own (e2e/stand.ts). e2e/check-coverage.mjs is the receipt
  # that no spec file is uncollected, and it runs in the frontend job.
  #
  # Runner decision: the container, on ubuntu-latest — and the point is the
  # container, not the runner. This job used to be macos-latest on the argument
  # that macOS is what ships. What that produced was two stands wearing one name:
  # a developer ran Linux/bash in the container and CI ran a macOS runner with
  # whatever shell it had, and no command existed that predicted the other.
  # Measured on 2026-08-07 at the same tree: the container reported 5 failures
  # and macOS 18, the two sets overlapping in ONE test. Four macOS failures could
  # not be reproduced locally at all, and two container failures were green on
  # macOS. A gate nobody can reproduce is not a gate.
  #
  # The image is what makes the two runs identical — not the OS. It pins the
  # Playwright build, both browser builds, Go and the three shells the launcher
  # tests drive. Running "ubuntu-latest plus npm ci" instead would move the
  # divergence rather than remove it.
  #
  # What this gives up, checked rather than assumed: Darwin PTY semantics and
  # Darwin paths are covered by `backend` on macos-latest (internal/pty,
  # internal/storage, including the -tags release build), and both macOS shells
  # by its 31 bash and 14 zsh tests in internal/shellintegration. WKWebView was
  # never covered here on either runner — Playwright drives its own browser
  # builds at a URL, never the app's webview. What is genuinely left uncovered is
  # the whole stack end to end on Darwin, whose one known instance is nocx-qduc,
  # already filed at P0. A macOS e2e job comes back when there is something for
  # it to prove that these do not (nocx-z9s9.8).
  #
  # No shards, and workers stays at 1 until each worker can be given its own
  # backend and home — the DocumentStore consumers rewrite whole documents, so
  # concurrency without that is a race (nocx-8rda).
  e2e:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Nothing else. No setup-go, no setup-node, no `playwright install`: every
      # one of those would provision a second copy of something the image
      # already pins, and the copy is where drift starts. A runner that needs
      # provisioning for this job is a sign the image stopped being the whole
      # answer.
      - name: e2e (container)
        run: e2e/run-in-container.sh

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
