# CI — quality gates for nocx.
#
# Runner decision: back-end job runs on macos-latest because:
#   - darwin is the target platform for this macOS-first MVP (see
#     docs/architecture.md § "Operational / Environmental Envelope"), so CI
#     should build and test what ships to users;
#   - internal/pty exercises creack/pty, and PTY semantics differ between macOS
#     and Linux — those tests are only meaningful on the target OS;
#   - the repo is public, so macos-latest runner minutes are free.
# (Note: wails/v2 also requires GTK3/WebKit2GTK on Linux; the decision stands
# on the target-OS argument alone, without measuring ubuntu.)
# The pre-commit hook and the Makefile `ci` target mirror this same set of
# checks so "green" is identical locally and in CI.
#
# Trigger decision: CI runs on pull requests to main, on release branches
# (release/**) and manual workflow_dispatch, and is *called* by release.yml via
# workflow_call so a tag release cannot exist without a green run on that exact
# commit. The `pull_request: [main]` trigger is the mechanical gate on main
# (nocx-q36): the local pre-commit hook and `make ci` give the same checks as
# fast feedback, but a hook is bypassable with --no-verify and `make hooks` is a
# per-clone step a fresh checkout may skip, so CI is what actually enforces "no
# merge without green". The standalone `push: tags: ['v*']` trigger stays gone:
# with release.yml calling this workflow, keeping it would run the whole suite
# twice for every release for no added protection (see distribution design §5).

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['release/**']
  workflow_dispatch:
  workflow_call:

# Least privilege: the quality gates only read the repo. When release.yml calls
# this workflow the effective token is the intersection with what the caller
# grants, so the publish job's write scope never reaches these jobs.
permissions:
  contents: read

jobs:
  backend:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check formatting
        run: |
          UNFMT=$(gofumpt -l .)
          if [ -n "$UNFMT" ]; then
            echo "gofumpt: the following files need formatting:"
            echo "$UNFMT"
            exit 1
          fi
          echo "gofumpt: all files formatted"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Lint
        run: golangci-lint run ./...

      - name: Build
        run: go build ./...

      # The shellintegration launcher tests fail, not skip, when the shell
      # they must prove is absent (nocx-gd84). macOS ships zsh but not dash;
      # TestBashLauncher_RunsUnderDash and TestPosixLauncher_EmitsMarkersFromPS1
      # both need dash, so a job that ran the suite as-is would fail them.
      # ubuntu-latest ships both shells; this step is macOS-only.
      - name: Install dash (shell integration tests)
        run: brew install dash

      - name: Test
        run: go test -race -count=1 ./...

      # The shipped profile directory lives behind `-tags release`
      # (internal/storage/appdir.go), so the ordinary run never compiles it. One
      # package, one assertion — but without it a typo there ships an app that
      # cannot find any existing installation's documents.
      - name: Test (release build tag)
        run: go test -race -count=1 -tags release ./internal/storage/...

  # backend-linux — Go tests on Linux, with and without a Secret Service.
  #
  # Runner decision: ubuntu-latest is the standard CI Linux image. The macOS
  # backend job tests the target OS; this job tests Linux behaviour, which
  # matters because go-keyring's back end is platform-specific and the
  # release pipeline ships a linux/amd64 AppImage.
  #
  # Matrix decision: two variants (with-keyring: true / false) in one job
  # rather than two separate jobs. Rationale: common steps (checkout,
  # setup-go, build) appear once; GitHub auto-labels each variant; one job
  # ID for required checks.
  backend-linux:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        with-keyring: [true, false]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # The same provisioning the macOS job needs, for the same reason: the
      # launcher tests fail rather than skip when the shell they exist to prove
      # is missing (nocx-gd84), and a skip there would hide the riskiest paths
      # in the package. macOS was given dash because it ships zsh; ubuntu is the
      # mirror image — it ships dash and no zsh — and never got the treatment,
      # so five zsh launcher tests were failing on main (nocx-bbkh).
      - name: Install zsh (shell integration tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh

      - name: Install Secret Service & dbus-x11
        if: matrix.with-keyring
        run: sudo apt-get install -y -qq gnome-keyring dbus-x11

      - name: Build
        run: go build ./...

      - name: Test (with Secret Service)
        if: matrix.with-keyring
        run: |
          dbus-run-session -- bash <<'TESTEOF'
          set -euo pipefail
          echo "=== Starting gnome-keyring-daemon ==="
          eval "$(echo -n "nocx-ci" | gnome-keyring-daemon --daemonize --login)"
          echo "=== Unlocking login keyring ==="
          echo -n "nocx-ci" | gnome-keyring-daemon --unlock
          echo "=== Running tests ==="
          go test -race -count=1 ./...
          TESTEOF

      - name: Test (no Secret Service)
        if: '!matrix.with-keyring'
        run: go test -race -count=1 ./...

  frontend:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # e2e — the checks that only exist in a real browser against the real app.
  #
  # Runner decision: macos-latest, for a different reason than the backend job.
  # Playwright drives its own Chromium against :34115, so the app's webview
  # engine (WKWebView here, WebKit2GTK on Linux) is never what these tests
  # observe — the engine argument does not apply. What decides it is cost of
  # machinery: `wails dev` on ubuntu needs GTK3/WebKit2GTK and an xvfb display
  # to open a window we never look at, while a macOS runner has a window server
  # already and the minutes are free for a public repo.
  #
  # No `wails dev` step here: playwright.config.ts starts and stops it, so a
  # clean checkout runs the suite with one command and nothing is left behind
  # (see the gracefulShutdown note there).
  #
  # Parallelism decision: shard across jobs, do NOT raise PW_WORKERS (nocx-qth1).
  #
  # The suite had grown from 40 tests to 109 while still running on the single
  # worker playwright.config.ts:85 defaults to, and was being cancelled at the
  # 20-minute cap without ever reporting a result — so every PR inherited a red
  # check and main had not been green since 2026-07-26.
  #
  # PW_WORKERS is the smaller diff and the wrong one. Every worker in a run
  # shares the ONE `wails dev` backend the webServer stanza starts, and
  # internal/storage/appdir.go is explicit that the profile split separates
  # development from release and NOT two development backends from each other:
  # every DocumentStore consumer loads its document and writes the whole thing
  # back (nocx-h2gf). Concurrent workers driving the vault, settings and
  # connection surfaces would be racing on those documents, and the failures
  # would arrive as flakes attributed to whatever spec lost.
  #
  # A shard is a separate job on a separate runner with its own backend and its
  # own isolated HOME, so the isolation is a property of the arrangement rather
  # than something the specs have to be trusted not to violate. Three shards put
  # the slowest job around a third of the old wall clock, which is the headroom
  # the bead asks for — margin, not a job that finishes at the cap.
  e2e:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # Pinned to the version in go.mod: the CLI builds the app, so a drift
      # between the two is a build no developer can reproduce locally.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # Root deps are @playwright/test only; `wails dev` runs frontend:install
      # itself, so the frontend is not installed here.
      - run: npm ci
      # Both engines the suite declares. WebKit is not a luxury here: the app
      # ships inside WKWebView, so WebKit is the closer of the two to what users
      # run, and installing only chromium would fail the run outright.
      - run: npx playwright install chromium webkit

      # --shard splits by test FILE, deterministically, so a file's tests always
      # stay together on one runner and a spec that relies on the order within
      # its own file is unaffected.
      - run: npx playwright test --shard=${{ matrix.shard }}/3

      # One artefact name per shard: three jobs uploading "playwright-traces"
      # would collide, and the traces from the failure you are chasing are the
      # ones that lose.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
